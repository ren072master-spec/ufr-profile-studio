・生殖関連","name":"膣長","input_type":"number","required":false,"notes":"架空国家の統一測定・登録値。医学的な性的優劣を示さない。"},{"id":"UFR-ME-04","category":"03 医療・生殖関連","name":"潤滑量","input_type":"number","required":false,"notes":"架空国家の統一測定・登録値。医学的な性的優劣を示さない。"},{"id":"UFR-ME-05","category":"03 医療・生殖関連","name":"潤滑ランク","input_type":"select","required":false,"notes":"架空国家の統一測定・登録値。医学的な性的優劣を示さない。"},{"id":"UFR-ME-06","category":"03 医療・生殖関連","name":"検査日","input_type":"date","required":false,"notes":"架空国家の統一測定・登録値。医学的な性的優劣を示さない。"},{"id":"UFR-ME-07","category":"03 医療・生殖関連","name":"検査規格","input_type":"text","required":false,"notes":"架空国家の統一測定・登録値。医学的な性的優劣を示さない。"},{"id":"UFR-HE-01","category":"03 医療・生殖関連","name":"ピル使用申告","input_type":"select","required":false,"notes":"本人申告・未登録の場合は不明"}]}</script><script>
'use strict';
const F=JSON.parse(document.getElementById('schema').textContent).fields;
const el=id=>document.getElementById(id);let people=[];
try{const raw=JSON.parse(localStorage.getItem('ufr-studio-v02')||localStorage.getItem('ufr-studio-v1')||'[]');people=Array.isArray(raw)?raw:Array.isArray(raw.people)?raw.people:[]}catch(e){console.warn(e)}
const params=new URLSearchParams(location.search);const target=params.get('person');
const select=el('person');people.forEach((p,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=(p.values?.['01-002']||p.name||'登録者')+' / '+(p.id||'番号未登録');select.append(opt)});
const found=people.findIndex(p=>String(p.id)===target||String(p.values?.['01-001'])===target);if(found>=0)select.value=String(found);
function addIssue(list,level,ids,message){list.push({level,ids,message})}
function inspect(v){const issues=[];const n=id=>{const x=v[id];return x===''||x==null?NaN:Number(x)};const filled=id=>{const x=v[id];return x!==undefined&&x!==null&&x!==''&&(!Array.isArray(x)||x.length>0)};
const age=n('01-006');if(Number.isFinite(age)&&age<18)addIssue(issues,'矛盾',['01-006'],'成人登録なのに年齢が18歳未満');
const birth=v['01-005'];if(birth&&Number.isFinite(age)){const b=new Date(birth+'T00:00:00');if(!isNaN(b)){const now=new Date();let years=now.getFullYear()-b.getFullYear();if(now.getMonth()<b.getMonth()||(now.getMonth()===b.getMonth()&&now.getDate()<b.getDate()))years--;if(Math.abs(years-age)>1)addIssue(issues,'矛盾',['01-005','01-006'],'生年月日と登録年齢が一致しない')}}
const status=String(v['UFR-EX-01']||'');const first=n('UFR-EX-06');if(status==='処女'&&filled('UFR-EX-06'))addIssue(issues,'矛盾',['UFR-EX-01','UFR-EX-06'],'処女区分と初体験年齢が一致しない');if(status!=='非処女'&&filled('UFR-EX-06'))addIssue(issues,'要確認',['UFR-EX-01','UFR-EX-06'],'非処女以外の区分に初体験年齢が残っている');if(status==='非処女'&&Number.isFinite(first)&&(first<18||(Number.isFinite(age)&&first>age)))addIssue(issues,'矛盾',['UFR-EX-06'],'初体験年齢が成人以降の登録条件または現在年齢に合わない');
const reports=n('UFR-EX-03');const review=String(v['UFR-EX-04']||'');if(Number.isFinite(reports)&&reports<0)addIssue(issues,'矛盾',['UFR-EX-03'],'通報件数が負の数');if(reports===0&&['審査中','訂正済'].includes(review))addIssue(issues,'要確認',['UFR-EX-03','UFR-EX-04'],'通報0件なのに審査中・訂正済となっている');
const rest=n('UFR-ME-01'),max=n('UFR-ME-02');if(Number.isFinite(rest)&&Number.isFinite(max)&&max<rest)addIssue(issues,'矛盾',['UFR-ME-01','UFR-ME-02'],'最大膣圧が安静時膣圧より低い');
const amount=n('UFR-ME-04'),rank=String(v['UFR-ME-05']||'');if(Number.isFinite(amount)&&rank){const expected=amount>=1.6?'A':amount>=1.2?'B':amount>=0.8?'C':amount>=0.4?'D':'E';if(rank!==expected)addIssue(issues,'要確認',['UFR-ME-04','UFR-ME-05'],'潤滑量とUFR独自ランクが一致しない')}
const ht=n('02-001'),wt=n('02-002'),bmi=n('02-003');if(Number.isFinite(ht)&&Number.isFinite(wt)&&Number.isFinite(bmi)&&ht>0){const expected=wt/Math.pow(ht/100,2);if(Math.abs(expected-bmi)>0.3)addIssue(issues,'要確認',['02-001','02-002','02-003'],'身長・体重とBMIが一致しない')}
return issues}
function valueText(v){if(v===undefined||v===null||v==='')return '—';if(Array.isArray(v))return v.join(' / ')||'—';if(typeof v==='string'&&v.startsWith('data:image/'))return '画像登録済み';return String(v)}
function render(){if(!people.length){el('results').textContent='このブラウザには登録者がありません。同じSafariでUFR Studioを開いてください。';return}const p=people[Number(select.value)||0];const v=p.values||{};const issues=inspect(v);const missing=F.filter(f=>{const x=v[f.id];return x===undefined||x===null||x===''||(Array.isArray(x)&&x.length===0)});el('total').textContent=F.length;el('issuesCount').textContent=issues.length;el('missingCount').textContent=missing.length;el('editLink').href='./editor.html?person='+encodeURIComponent(p.id||v['01-001']||'');
const mode=el('mode').value;
let coverage=el('ufr-coverage');
if(!coverage){
 coverage=document.createElement('p');coverage.id='ufr-coverage';coverage.className='muted';
 const target=el('results');target.parentNode.insertBefore(coverage,target);
}
coverage.textContent='自動チェック：7種類（年齢・生年月日、経験区分、通報・審査、膣圧、潤滑ランク、BMI）。未入力は別集計。チェック対象外の情報は手動確認が必要です。';const results=el('results'),categories=el('categories');results.replaceChildren();categories.replaceChildren();
if(mode==='issues'){const title=document.createElement('h2');title.textContent='要確認の項目';results.append(title);if(!issues.length){const p=document.createElement('p');p.className='muted';p.textContent='自動チェック7種類では問題を検出しませんでした。182項目すべての正しさを保証するものではありません。未入力も別途確認してください。';results.append(p)}issues.forEach(issue=>{const d=document.createElement('div');d.className='item';const strong=document.createElement('strong');strong.textContent=issue.level+'：'+issue.message;d.append(strong);const info=document.createElement('p');info.textContent=issue.ids.map(id=>{const f=F.find(x=>x.id===id);return (f?.name||id)+'：'+valueText(v[id])}).join(' ／ ');d.append(info);results.append(d)})}
if(mode!=='issues'){const heading=document.createElement('h2');heading.textContent=mode==='all'?'全項目一覧':'カテゴリー別の登録情報';categories.append(heading);[...new Set(F.map(f=>f.category))].forEach(cat=>{const detail=document.createElement('details');detail.className='category';detail.open=mode==='all';const summary=document.createElement('summary');summary.textContent=cat;detail.append(summary);F.filter(f=>f.category===cat).forEach(f=>{const row=document.createElement('div');row.className='entry';const k=document.createElement('span'),vEl=document.createElement('span');k.textContent=f.name;vEl.textContent=valueText(v[f.id]);row.append(k,vEl);detail.append(row)});categories.append(detail)})}}
select.onchange=render;el('mode').onchange=render;render();
</script></body></html>
