function show(mode){
 const selected=modes.find(x=>x[0]===mode)||modes[0];
 document.getElementById('heading').textContent=selected[1];
 const note=document.getElementById('viewNote');if(note)note.textContent=selected[2];
 fields.replaceChildren();
 if(mode==='body'){
  const b=Number(v['02-004']),w=Number(v['02-005']),h=Number(v['02-006']),u=Number(v['02-021']);
  const valid=x=>Number.isFinite(x)&&x>0;
  const panel=document.createElement('section');panel.className='ufr-measure-summary';
  const title=document.createElement('h3');title.textContent='身体寸法 / B・W・H';panel.append(title);
  const measurements=document.createElement('div');measurements.className='ufr-measure-grid';
  for(const [label,val] of [['BUST',b],['WAIST',w],['HIP',h]]){
   const cell=document.createElement('div');const key=document.createElement('small');key.textContent=label;
   const num=document.createElement('strong');num.textContent=valid(val)?val+' cm':'—';
   cell.append(key,num);measurements.append(cell)
  }panel.append(measurements);
  const info=document.createElement('div');info.className='ufr-bra-line';
  const difference=valid(b)&&valid(u)?b-u:null;
  // Japanese standard approximate cup intervals, 2.5cm steps.
  const cupLetters=['AAA','AA','A','B','C','D','E','F','G','H','I','J','K'];
  const idx=difference===null?-1:Math.round((difference-5)/2.5);
  const cup=idx>=0&&idx<cupLetters.length?cupLetters[idx]:'—';
  const underSize=valid(u)?Math.round(u/5)*5:null;
  info.textContent='アンダー：'+(valid(u)?u+'cm':'未登録')+'　／　カップ：'+cup+'　／　ブラサイズ：'+(cup!=='—'&&underSize?cup+underSize:'未登録');
  panel.append(info);fields.append(panel);
 }
 tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
 const list=F.filter(f=>sectionOf(f)===mode);
 const root=document.createElement('div');root.className='admin-groups';
 const categories=[...new Set(list.map(f=>f.category))];
 categories.forEach((category,i)=>{
  const group=list.filter(f=>f.category===category);
  const details=document.createElement('details');
  if(i===0&&mode!=='admin')details.open=true;
  const summary=document.createElement('summary');
  summary.textContent=category+'（'+group.length+'項目）';details.append(summary);
  const grid=document.createElement('div');grid.className='fields';
  group.forEach(f=>addField(grid,f));details.append(grid);root.append(details)
 });
 fields.append(root);
 const count=document.getElementById('fieldCount');
 if(count)count.textContent='登録項目 '+list.length+'件 / 全'+F.length+'項目';
}
modes.forEach(([mode,title])=>{const b=document.createElement('button');b.textContent=title;b.dataset.mode=mode;b.addEventListener('click',()=>show(mode));tabs.append(b)});show('profile');

})();
</script></body></html>
